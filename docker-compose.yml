services:
  nominatim:
    image: mediagis/nominatim:5.3
    container_name: nominatim_france
    shm_size: '4gb'
    #restart: always
    ports:
      - "7990:8080"
    environment:
      # Paramètres pour l'import initial
      - PBF_PATH=/data/france-260410.osm.pbf
      - THREADS=2
    volumes:
      # Ce volume stocke la base de données.
      # S'il est plein, Nominatim ignorera l'importation au prochain redémarrage.
      - nominatim-data:/var/lib/postgresql/16/main
      # Pour stocker les fichiers d'indexation
      - nominatim-flatnode:/nominatim/flatnode
      - ./data:/data:ro

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.1
    container_name: elasticsearch-kovoit
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 10s
      retries: 10

  elasticsearch-setup:
    image: curlimages/curl:latest
    restart: on-failure
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: >
      curl -X PUT "http://elasticsearch:9200/travelers"
      -H "Content-Type: application/json"
      -d '{
        "mappings": {
          "properties": {
            "firstName":   { "type": "text" },
            "lastName":    { "type": "text" },
            "email":       { "type": "text" },
            "address": {
              "properties": {
                "fullAddress": { "type": "text" },
                "location":    { "type": "geo_point" }
              }
            },
            "isDriver": { "type": "boolean" },
            "companyId": { "type": "keyword" }
          }
        }
      }'

  # Pré-traitement OSRM (extract -> partition -> customize) à partir du même extract
  # que Nominatim. Attention : traite la France entière, potentiellement long/gourmand
  # en mémoire en local ; relancer "docker compose up" ré-exécute ce pré-traitement
  # (pas de cache/idempotence gérée ici). Envisager un extract plus petit pour le dev.
  osrm-extract:
    image: osrm/osrm-backend:v5.25.0
    platform: linux/amd64
    volumes:
      - ./data:/data
    command: sh -c "test -f /data/france-260410.osrm || osrm-extract -t 2 -p /opt/car.lua /data/france-260410.osm.pbf"

  osrm-partition:
    image: osrm/osrm-backend:v5.25.0
    platform: linux/amd64
    depends_on:
      osrm-extract:
        condition: service_completed_successfully
    volumes:
      - ./data:/data
    command: sh -c "test -f /data/france-260410.osrm.partition || osrm-partition /data/france-260410.osrm"

  osrm-customize:
    image: osrm/osrm-backend:v5.25.0
    platform: linux/amd64
    depends_on:
      osrm-partition:
        condition: service_completed_successfully
    volumes:
      - ./data:/data
    command: sh -c "test -f /data/france-260410.osrm.mldgr || osrm-customize /data/france-260410.osrm"

  osrm-routed:
    image: osrm/osrm-backend:v5.25.0
    platform: linux/amd64
    container_name: osrm_france
    depends_on:
      osrm-customize:
        condition: service_completed_successfully
    ports:
      - "5050:5000"
    volumes:
      - ./data:/data
    command: osrm-routed --algorithm mld /data/france-260410.osrm

volumes:
  nominatim-data:
  nominatim-flatnode:
  elasticsearch-data: